<!doctype html><meta charset=utf-8><style>html,body{margin:0}canvas{display:block}</style>
<canvas id=c width=1920 height=1080></canvas>
<script type="module">
const x = document.getElementById('c').getContext('2d');
const F = (w,s)=>`${w} ${s}px "Liberation Sans",Arial,sans-serif`;

// ---- 2026 PALETTE: saturated, high contrast, hard edges -------------------
const P = {
  ink:   '#14141A',
  paper: '#FFF4E4',
  lime:  '#B9FF39',
  mint:  '#00E39A',
  coral: '#FF5A5F',
  violet:'#8A5CFF',
  sun:   '#FFC93C',
  sky:   '#3ACBFF',
};
const LW = 11;                 // thick. this is the whole point.
function S(fn){x.save();try{fn()}finally{x.restore()}}
function rr(px,py,w,h,r,fill,stroke,lw){
  x.beginPath();
  const m=Math.min(Math.abs(w),Math.abs(h))/2, rad=Math.min(r,m);
  x.moveTo(px+rad,py); x.arcTo(px+w,py,px+w,py+h,rad); x.arcTo(px+w,py+h,px,py+h,rad);
  x.arcTo(px,py+h,px,py,rad); x.arcTo(px,py,px+w,py,rad); x.closePath();
  if(fill){x.fillStyle=fill;x.fill()} if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||LW;x.stroke()}
}
function circ(cx,cy,r,fill,stroke,lw){x.beginPath();x.arc(cx,cy,r,0,7);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||LW;x.stroke()}}
function ell(cx,cy,rx,ry,rot,fill,stroke,lw){x.beginPath();x.ellipse(cx,cy,rx,ry,rot||0,0,7);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||LW;x.stroke()}}
function txt(s,px,py,o={}){S(()=>{x.font=F(o.w||900,o.s||40);x.textAlign=o.a||'center';x.textBaseline='middle';
  if(o.letter)x.letterSpacing=o.letter+'px';
  if(o.hard){x.fillStyle=P.ink;x.fillText(s,px+o.hard,py+o.hard)}
  if(o.stroke){x.lineWidth=o.sw||14;x.strokeStyle=o.stroke;x.lineJoin='round';x.strokeText(s,px,py)}
  x.fillStyle=o.c||P.ink;x.fillText(s,px,py)})}

// ---- the cursor head ------------------------------------------------------
function headPath(){
  // a fat pointer, tilted the way every cursor on earth is tilted
  x.beginPath();
  x.moveTo(0,-150);
  x.quadraticCurveTo(-14,-158,-22,-142);
  x.lineTo(-96,72);  x.quadraticCurveTo(-100,90,-82,90);
  x.lineTo(-26,80);  x.quadraticCurveTo(-12,78,-6,90);
  x.lineTo(18,148);  x.quadraticCurveTo(26,164,44,156);
  x.lineTo(74,143);  x.quadraticCurveTo(90,136,82,120);
  x.lineTo(58,64);   x.quadraticCurveTo(52,50,66,44);
  x.lineTo(120,24);  x.quadraticCurveTo(138,17,126,2);
  x.closePath();
}

/** KLIKO — a cursor that has opinions. Big head, tiny everything else. */
function kliko(px,py,s,o={}){
  const tilt = o.tilt ?? -0.20;
  S(()=>{
    x.translate(px,py); x.scale(s,s);
    // hard shadow. solid, offset, no blur anywhere in this style.
    S(()=>{ x.translate(18,20); x.rotate(tilt); x.translate(0,-150);
      headPath(); x.fillStyle=P.ink; x.globalAlpha=.85; x.fill(); });

    // tiny legs
    S(()=>{ x.strokeStyle=P.ink; x.lineWidth=LW; x.lineCap='round';
      const st=o.step||0;
      x.beginPath(); x.moveTo(-26,-10); x.lineTo(-40-st*14,52); x.stroke();
      x.beginPath(); x.moveTo(26,-10); x.lineTo(40+st*14,52); x.stroke();
      rr(-64-st*14,52,50,22,11,P.paper,P.ink,LW*.8);
      rr(14+st*14,52,50,22,11,P.paper,P.ink,LW*.8); });

    // tiny arms
    S(()=>{ x.strokeStyle=P.ink; x.lineWidth=LW; x.lineCap='round';
      const a=o.arm??0;
      x.beginPath(); x.moveTo(-42,-72); x.lineTo(-96,-92-a*70); x.stroke();
      circ(-96,-92-a*70,14,P.paper,P.ink,LW*.75);
      x.beginPath(); x.moveTo(42,-72); x.lineTo(96,-92-a*70); x.stroke();
      circ(96,-92-a*70,14,P.paper,P.ink,LW*.75); });

    // tiny body
    rr(-40,-96,80,92,26,o.fill||P.paper,P.ink,LW);
    rr(-40,-56,80,16,0,o.accent||P.lime);

    // the head
    S(()=>{
      x.rotate(tilt); x.translate(0,-150);
      headPath(); x.fillStyle=o.fill||P.paper; x.fill();
      headPath(); x.strokeStyle=P.ink; x.lineWidth=LW; x.lineJoin='round'; x.stroke();
      // the one saturated thing on him: a click-ring badge near the tip
      circ(-6,-104,17,o.accent||P.lime,P.ink,LW*.7);

      // face, low in the fat part where there is room for it
      const ex=(o.look||0)*11, eo=o.eye??1;
      S(()=>{
        x.rotate(-tilt);                      // the face stays level. always.
        ell(-34+ex,6,27,29*eo,0,P.ink);
        ell(24+ex,6,27,29*eo,0,P.ink);
        if(eo>.4){ circ(-42+ex,-4,10,'#fff'); circ(16+ex,-4,10,'#fff'); }
        x.strokeStyle=P.ink; x.lineWidth=10; x.lineCap='round';
        const m=o.mouth;
        if(m==='o'){ ell(-5,58,17,23,0,P.ink); ell(-5,66,9,8,0,P.coral); }
        else if(m==='smile'){ x.beginPath(); x.arc(-5,42,28,.32,2.82); x.stroke(); }
        else if(m==='grin'){ x.beginPath(); x.moveTo(-38,44); x.quadraticCurveTo(-5,88,26,42); x.closePath(); x.fillStyle=P.ink; x.fill();
          S(()=>{ x.beginPath(); x.moveTo(-38,44); x.quadraticCurveTo(-5,88,26,42); x.closePath(); x.clip(); rr(-40,40,70,12,0,'#fff'); }); }
        else { x.beginPath(); x.moveTo(-30,52); x.lineTo(20,52); x.stroke(); }
        if(o.brow!==undefined){ x.lineWidth=11;
          x.beginPath(); x.moveTo(-58,-38); x.lineTo(-14,-28-o.brow*16); x.stroke();
          x.beginPath(); x.moveTo(0,-28-o.brow*16); x.lineTo(44,-38); x.stroke(); }
      });
    });
  });
}

// ================= SHEET =================
x.fillStyle=P.paper; x.fillRect(0,0,1920,1080);
// colour-blocked bands, the way a feed video blocks colour
rr(0,0,1920,120,0,P.violet); rr(0,960,1920,120,0,P.ink);
txt('NEW STYLE TEST — 2026',960,60,{s:44,c:'#fff',letter:6});
txt('THICK OUTLINES · HARD SHADOWS · SATURATED BLOCKS · CHUNKY TYPE',960,1020,{s:30,c:P.lime,letter:4});

// left: the character, four reads
const poses=[
  {x:250,y:400,o:{mouth:'flat',brow:1},lab:'DEADPAN',bg:P.sun},
  {x:620,y:400,o:{mouth:'o',eye:1.3,arm:1,tilt:-.1},lab:'PANIC',bg:P.coral},
  {x:250,y:790,o:{mouth:'grin',brow:-1,arm:.4},lab:'SMUG',bg:P.mint},
  {x:620,y:790,o:{mouth:'smile',eye:.22,step:1},lab:'HAPPY',bg:P.sky},
];
poses.forEach(p=>{
  S(()=>{ rr(p.x-175,p.y-215,350,380,28,p.bg,P.ink,LW); });
  S(()=>{ rr(p.x-175,p.y-215,350,380,28,0,0,0); x.clip(); kliko(p.x,p.y+96,.80,p.o); });
  S(()=>{ rr(p.x-118,p.y+96,236,54,27,P.ink); txt(p.lab,p.x,p.y+124,{s:27,c:'#fff',letter:4}); });
});

// right: a feed-thumbnail mock in the new style
S(()=>{
  x.translate(1020,190);
  rr(0,0,820,462,26,P.violet,P.ink,LW);
  S(()=>{ rr(10,10,800,442,20,0); x.clip();
    rr(0,0,820,462,0,P.violet);
    for(let i=0;i<7;i++) rr(-60+i*130,-40,70,560,0,'rgba(255,255,255,.07)');
    kliko(200,430,1.02,{mouth:'o',eye:1.3,arm:1,tilt:-.1});
    S(()=>{ x.translate(660,120); x.rotate(.12);
      circ(0,0,110,P.sun,P.ink,LW); circ(0,0,70,P.coral,P.ink,LW*.7);
      x.strokeStyle=P.ink;x.lineWidth=22;x.lineCap='round';
      x.beginPath();x.moveTo(-70,-70);x.lineTo(70,70);x.stroke();
      x.beginPath();x.moveTo(70,-70);x.lineTo(-70,70);x.stroke(); });
    txt('PROVE',560,268,{s:92,c:P.lime,stroke:P.ink,sw:17,hard:7});
    txt('YOU EXIST',560,364,{s:92,c:'#fff',stroke:P.ink,sw:17,hard:7});
  });
});
S(()=>{ x.translate(1020,700);
  rr(0,0,820,180,26,P.lime,P.ink,LW);
  txt('SAME SHOT, OLD STYLE →  low contrast, thin lines, muted',410,54,{s:26,c:P.ink,letter:1});
  // the old look, for comparison
  S(()=>{ rr(40,80,340,80,16,'#F5F5F7','#202027',5);
    txt('PROVE YOU EXIST',210,120,{s:30,w:700,c:'#202027'}); });
  S(()=>{ rr(440,80,340,80,16,P.ink,P.ink,LW);
    txt('PROVE YOU EXIST',610,120,{s:30,w:900,c:P.lime,letter:1}); });
});
window.__tabbi={ready:true,seek(){}};
</script>
